server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: account-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/accounts/**
          filters:
            - JwtAuthenticationFilter
        - id: transaction-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**
          filters:
            - JwtAuthenticationFilter
jwt:
  secret: "BankingUltraSecureSecretKeyForJwtSigning1234567890!"
